name: Feature request
description: Something you'd like the app to do.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to do?
      description: The task you're trying to get done, more than a particular button.
      placeholder: I often need to fill in the same form every month and would like to …
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How do you do it today?
      description: Another app, a workaround, or not at all.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0"
  - type: input
    id: system
    attributes:
      label: System
      placeholder: "windows-x86_64, Windows 11"
